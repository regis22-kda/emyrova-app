name: emyrova_app
description: "A playful couple's app for interactive games and connection."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.0
  
  # UI & Design
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  equatable: ^2.0.5
  intl: ^0.18.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/content.json
    - assets/images/
